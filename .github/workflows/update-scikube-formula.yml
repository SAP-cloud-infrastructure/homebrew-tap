name: Update scikube formula

on:
  schedule:
    # Poll every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4

      - name: Fetch latest Persephone release
        id: release
        run: |
          release=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SAP-cloud-infrastructure/persephone/releases/latest)

          tag=$(echo "$release" | jq -r '.tag_name')          # e.g. v1.2.3
          version=${tag#v}                                     # strip leading 'v'

          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether formula already tracks this version
        id: check
        run: |
          current=$(grep -m1 '^\s*version ' scikube.rb | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "current=$current" >> "$GITHUB_OUTPUT"

          if [ "$current" = "${{ steps.release.outputs.version }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch checksums.txt
        if: steps.check.outputs.up_to_date == 'false'
        id: checksums
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          url="https://github.com/SAP-cloud-infrastructure/persephone/releases/download/${TAG}/checksums.txt"
          checksums=$(curl -fsSL "$url")

          get_sha() {
            echo "$checksums" | awk -v f="$1" '$2 == f { print $1 }'
          }

          darwin_arm64=$(get_sha "scikube-${VERSION}-darwin-arm64.tar.gz")
          linux_amd64=$(get_sha  "scikube-${VERSION}-linux-amd64.tar.gz")
          linux_arm64=$(get_sha  "scikube-${VERSION}-linux-arm64.tar.gz")

          echo "darwin_arm64=$darwin_arm64" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$linux_amd64"   >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$linux_arm64"   >> "$GITHUB_OUTPUT"

      - name: Render updated scikube.rb
        if: steps.check.outputs.up_to_date == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.checksums.outputs.linux_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.checksums.outputs.linux_arm64 }}
        run: |
          base_url="https://github.com/SAP-cloud-infrastructure/persephone/releases/download/${TAG}"

          cat > scikube.rb <<FORMULA
          # typed: true
          # frozen_string_literal: true

          # Scikube is a formula for installing the scikube CLI
          class Scikube < Formula
            desc "CLI for managing SCI Customer Gardener clusters"
            homepage "https://github.com/SAP-cloud-infrastructure/persephone"
            version "${VERSION}"

            if OS.mac?
              if Hardware::CPU.arm?
                url "${base_url}/scikube-${VERSION}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
            elsif OS.linux?
              if Hardware::CPU.arm?
                url "${base_url}/scikube-${VERSION}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "${base_url}/scikube-${VERSION}-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "scikube"
            end

            test do
              system "#{bin}/scikube", "version"
            end
          end
          FORMULA

          # Strip the leading indentation added by the heredoc inside 'run'
          sed -i 's/^          //' scikube.rb

      - name: Open / update pull request
        if: steps.check.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat: update scikube formula to ${{ steps.release.outputs.version }}"
          branch: "automation/scikube-${{ steps.release.outputs.version }}"
          delete-branch: true
          title: "feat: update scikube to ${{ steps.release.outputs.version }}"
          body: |
            Automated update of the `scikube` Homebrew formula.

            - **New version**: `${{ steps.release.outputs.version }}`
            - **Previous version**: `${{ steps.check.outputs.current }}`
            - **Release**: https://github.com/SAP-cloud-infrastructure/persephone/releases/tag/${{ steps.release.outputs.tag }}

            URLs and SHA-256 checksums sourced from the release's `checksums.txt`.
          labels: "automated,scikube"
          add-paths: scikube.rb
